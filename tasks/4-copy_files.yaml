- name: Copy Helm binary to install path
  ansible.builtin.copy:
    src: "{{ temporary_folder }}/helm/linux-amd64/helm"
    dest: "{{ install_path }}"
    mode: "0550"
    owner: "{{ ansible_env.SUDO_USER }}"
    group: "{{ ansible_env.SUDO_USER }}"
    remote_src: true

